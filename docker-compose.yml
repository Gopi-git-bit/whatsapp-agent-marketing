version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=django_password

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    command: uvicorn backend.asgi:application --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_DEBUG=0
      - DJANGO_DB_ENGINE=django.db.backends.postgresql
      - DJANGO_DB_NAME=django_db
      - DJANGO_DB_USER=django_user
      - DJANGO_DB_PASSWORD=django_password
      - DJANGO_DB_HOST=db
      - DJANGO_DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CHANNELS_REDIS_URL=redis://redis:6379/2
    expose:
      - "8000"
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media
    ports:
      - "80:80"
    depends_on:
      - backend

  worker:
    build: ./backend
    command: celery -A backend worker -l info
    volumes:
      - ./backend:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_DB_HOST=db
      - DJANGO_DB_NAME=django_db
      - DJANGO_DB_USER=django_user
      - DJANGO_DB_PASSWORD=django_password
    depends_on:
      - db
      - redis

  beat:
    build: ./backend
    command: celery -A backend beat -l info
    volumes:
      - ./backend:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_DB_HOST=db
      - DJANGO_DB_NAME=django_db
      - DJANGO_DB_USER=django_user
      - DJANGO_DB_PASSWORD=django_password
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
